<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141422"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c5cfc">
        <animate attributeName="stop-color" values="#7c5cfc;#22d3ee;#34d399;#fb923c;#7c5cfc" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="33%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#34d399;#fb923c;#7c5cfc;#a78bfa" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="66%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#fb923c;#7c5cfc;#34d399;#22d3ee" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#7c5cfc;#22d3ee;#fb923c;#34d399" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c5cfc" stop-opacity="0"/>
      <stop offset="20%" stop-color="#7c5cfc" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="ambientGlow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.5" fill="#7c5cfc"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="840" height="280" fill="url(#bgGlow)"/>
  <rect width="840" height="280" fill="url(#dotGrid)" opacity="0.1"/>

  <!-- Ambient glow -->
  <ellipse cx="420" cy="108" rx="280" ry="80" fill="#7c5cfc" opacity="0.03" filter="url(#ambientGlow)"/>

  <!-- Particles — top region -->
  <circle cx="75" cy="38" r="1.0" fill="#7c5cfc" opacity="0.3">
    <animate attributeName="cy" values="38;24;38" dur="22s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="22s" repeatCount="indefinite"/>
  </circle>
  <circle cx="155" cy="52" r="1.4" fill="#22d3ee" opacity="0.25">
    <animate attributeName="cy" values="52;34;52" dur="28s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.08;0.25" dur="28s" repeatCount="indefinite"/>
  </circle>
  <circle cx="235" cy="28" r="0.8" fill="#34d399" opacity="0.3">
    <animate attributeName="cy" values="28;18;28" dur="20s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="20s" repeatCount="indefinite"/>
  </circle>
  <circle cx="335" cy="48" r="1.2" fill="#7c5cfc" opacity="0.2">
    <animate attributeName="cy" values="48;32;48" dur="25s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.06;0.2" dur="25s" repeatCount="indefinite"/>
  </circle>
  <circle cx="435" cy="32" r="0.6" fill="#fb923c" opacity="0.25">
    <animate attributeName="cy" values="32;22;32" dur="30s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.08;0.25" dur="30s" repeatCount="indefinite"/>
  </circle>
  <circle cx="525" cy="55" r="1.3" fill="#22d3ee" opacity="0.2">
    <animate attributeName="cy" values="55;40;55" dur="24s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.06;0.2" dur="24s" repeatCount="indefinite"/>
  </circle>
  <circle cx="605" cy="35" r="0.9" fill="#34d399" opacity="0.25">
    <animate attributeName="cy" values="35;20;35" dur="26s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.08;0.25" dur="26s" repeatCount="indefinite"/>
  </circle>
  <circle cx="695" cy="42" r="1.1" fill="#7c5cfc" opacity="0.2">
    <animate attributeName="cy" values="42;28;42" dur="23s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.06;0.2" dur="23s" repeatCount="indefinite"/>
  </circle>
  <circle cx="770" cy="25" r="1.3" fill="#22d3ee" opacity="0.2">
    <animate attributeName="cy" values="25;14;25" dur="27s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.06;0.2" dur="27s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="18" r="0.7" fill="#fb923c" opacity="0.2">
    <animate attributeName="cy" values="18;10;18" dur="32s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.06;0.2" dur="32s" repeatCount="indefinite"/>
  </circle>

  <!-- Particles — bottom region -->
  <circle cx="55" cy="228" r="1.0" fill="#34d399" opacity="0.25">
    <animate attributeName="cy" values="228;218;228" dur="20s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.08;0.25" dur="20s" repeatCount="indefinite"/>
  </circle>
  <circle cx="175" cy="242" r="1.2" fill="#7c5cfc" opacity="0.2">
    <animate attributeName="cy" values="242;228;242" dur="26s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.06;0.2" dur="26s" repeatCount="indefinite"/>
  </circle>
  <circle cx="295" cy="232" r="0.8" fill="#22d3ee" opacity="0.25">
    <animate attributeName="cy" values="232;220;232" dur="24s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.08;0.25" dur="24s" repeatCount="indefinite"/>
  </circle>
  <circle cx="405" cy="248" r="1.1" fill="#34d399" opacity="0.2">
    <animate attributeName="cy" values="248;236;248" dur="22s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.06;0.2" dur="22s" repeatCount="indefinite"/>
  </circle>
  <circle cx="535" cy="238" r="0.9" fill="#7c5cfc" opacity="0.2">
    <animate attributeName="cy" values="238;226;238" dur="28s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.06;0.2" dur="28s" repeatCount="indefinite"/>
  </circle>
  <circle cx="655" cy="225" r="1.2" fill="#22d3ee" opacity="0.2">
    <animate attributeName="cy" values="225;214;225" dur="21s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.06;0.2" dur="21s" repeatCount="indefinite"/>
  </circle>
  <circle cx="765" cy="240" r="0.7" fill="#34d399" opacity="0.25">
    <animate attributeName="cy" values="240;230;240" dur="26s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.08;0.25" dur="26s" repeatCount="indefinite"/>
  </circle>
  <circle cx="825" cy="232" r="1.0" fill="#fb923c" opacity="0.15">
    <animate attributeName="cy" values="232;224;232" dur="30s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.05;0.15" dur="30s" repeatCount="indefinite"/>
  </circle>

  <!-- Particles — edges -->
  <circle cx="18" cy="132" r="0.7" fill="#7c5cfc" opacity="0.15">
    <animate attributeName="cy" values="132;122;132" dur="25s" repeatCount="indefinite"/>
  </circle>
  <circle cx="822" cy="148" r="0.7" fill="#22d3ee" opacity="0.15">
    <animate attributeName="cy" values="148;138;148" dur="23s" repeatCount="indefinite"/>
  </circle>

  <!-- Corner accents -->
  <path d="M 2 22 L 2 2 L 22 2" stroke="#7c5cfc" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M 818 2 L 838 2 L 838 22" stroke="#22d3ee" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M 2 258 L 2 278 L 22 278" stroke="#34d399" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M 818 278 L 838 278 L 838 258" stroke="#fb923c" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Title -->
  <text x="420" y="115" text-anchor="middle" font-family="'Courier New', Consolas, 'Liberation Mono', monospace" font-size="54" font-weight="bold" fill="url(#titleGrad)" filter="url(#glow)" letter-spacing="8">BAD-ANTICS</text>

  <!-- Tagline -->
  <text x="420" y="152" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="14" fill="#a78bfa" opacity="0.85" letter-spacing="2">security  |&gt;  research  |&gt;  engineering  |&gt;  innovation</text>

  <!-- Separator line -->
  <rect x="140" y="178" width="560" height="1" fill="url(#lineGrad)" rx="0.5"/>

  <!-- Stats -->
  <text x="420" y="208" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="11" fill="#8888a8" letter-spacing="2.5">732 REPOS  ·  140+ TOOLS  ·  60 MERGED PRs  ·  1M+ STARS REACHED</text>

  <!-- Status indicators -->
  <g opacity="0.6">
    <circle cx="335" cy="245" r="2.5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="344" y="248" font-family="'Courier New', monospace" font-size="9" fill="#34d399" letter-spacing="1.5">ACTIVE</text>

    <circle cx="412" cy="245" r="2.5" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="421" y="248" font-family="'Courier New', monospace" font-size="9" fill="#22d3ee" letter-spacing="1.5">BUILDING</text>

    <circle cx="502" cy="245" r="2.5" fill="#7c5cfc">
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="511" y="248" font-family="'Courier New', monospace" font-size="9" fill="#7c5cfc" letter-spacing="1.5">SHIPPING</text>
  </g>

  <!-- Scan line -->
  <rect x="0" y="0" width="840" height="1" fill="url(#lineGrad)" opacity="0.06">
    <animate attributeName="y" values="-1;281" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
