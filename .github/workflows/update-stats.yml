name: Update Profile Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
          
      - name: Update Statistics
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = 'bad-antics';
            
            console.log('📊 Fetching repository statistics...');
            
            let repos = [];
            let page = 1;
            while (true) {
              const { data } = await github.rest.repos.listForUser({
                username: owner,
                per_page: 100,
                page: page
              });
              if (data.length === 0) break;
              repos = repos.concat(data);
              page++;
            }
            
            const repoCount = repos.length;
            console.log('📦 Total repositories: ' + repoCount);
            
            const langStats = {};
            for (const repo of repos.slice(0, 50)) {
              try {
                const { data: languages } = await github.rest.repos.listLanguages({
                  owner: owner,
                  repo: repo.name
                });
                for (const [lang, bytes] of Object.entries(languages)) {
                  langStats[lang] = (langStats[lang] || 0) + bytes;
                }
              } catch (e) {}
            }
            
            const sortedLangs = Object.entries(langStats).sort((a, b) => b[1] - a[1]);
            const langCount = sortedLangs.length;
            console.log('🌍 Languages detected: ' + langCount);
            
            const securityTools = repos.filter(r => r.name.startsWith('nullsec-')).length;
            console.log('🛠️ Security tools: ' + securityTools);
            
            let readme = fs.readFileSync('README.md', 'utf8');
            readme = readme.replace(/Repositories-\d+-blue/g, 'Repositories-' + repoCount + '-blue');
            
            const now = new Date().toISOString().split('T')[0];
            readme = readme.replace(/Internet Optimized \d{4}-\d{2}-\d{2}/, 'Internet Optimized ' + now);
            
            fs.writeFileSync('README.md', readme);
            console.log('✅ README.md updated');
            
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "📊 Auto-update stats"
          git push || echo "Nothing to push"
