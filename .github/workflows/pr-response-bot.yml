name: NullSec Response Bot

on:
  pull_request_target:
    types: [opened, reopened, closed, synchronize]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  issues:
    types: [opened, labeled]
  schedule:
    - cron: '0 9 * * 1'  # Weekly Monday 9am - stale check

permissions:
  pull-requests: write
  issues: write
  contents: read

env:
  STALE_DAYS: 14

jobs:
  # ========== ISSUE HANDLERS ==========
  welcome-issue:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Welcome and Classify Issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const author = issue.user.login;
            const repoOwner = context.repo.owner;
            
            // Don't respond to own issues
            if (author === repoOwner) return;
            
            const title = issue.title.toLowerCase();
            const body = (issue.body || '').toLowerCase();
            
            let response = '';
            let labels = [];
            let isPriority = false;
            
            // === COLLABORATION REQUEST ===
            if (body.includes('collaborate') || body.includes('team up') || 
                body.includes('work together') || body.includes('partnership') ||
                body.includes('join the team') || body.includes('contribute to nullsec') ||
                title.includes('collaboration') || title.includes('team up')) {
              
              response = `
## 👋 Hey @${author}! Thanks for reaching out about collaborating!

I'm **always** excited to connect with fellow security researchers and developers!

### 🤝 Ways to Get Involved:

| Type | Description |
|------|-------------|
| 🔧 **Code** | PRs welcome! Check \`good first issue\` labels |
| 📖 **Docs** | Help with documentation, tutorials, guides |
| 🧪 **Testing** | Test new features, report bugs |
| 💡 **Ideas** | Share feature ideas and improvements |
| 🔬 **Research** | Security research, CVE hunting |

### 📋 Let's Connect:

Could you tell me more about:
1. **Your background** - What's your expertise area?
2. **Interest area** - Which NullSec tools interest you most?
3. **Availability** - How much time can you dedicate?
4. **Goals** - What do you hope to achieve?

I'll respond personally very soon! 🚀

---
*🤖 NullSec Bot - Flagged as priority for personal follow-up*
`;
              labels = ['collaboration', 'priority', 'needs-response'];
              isPriority = true;
              
            // === BUG REPORT ===
            } else if (title.includes('bug') || title.includes('error') || 
                      title.includes('crash') || title.includes('not working') ||
                      title.includes('broken') || title.includes('fail')) {
              
              response = `
## 👋 Thanks for the bug report, @${author}!

I'll investigate this ASAP. To help me fix it faster:

### 📋 Please Provide:

- **Environment:** OS, kernel version, architecture
- **Tool Version:** \`tool --version\` output
- **Steps to Reproduce:** Exact commands/actions
- **Expected vs Actual:** What should happen vs what happened
- **Logs:** Error messages, stack traces, debug output

### 🔍 Quick Checks:

- [ ] Are you using the latest version?
- [ ] Did you check existing issues for duplicates?
- [ ] Have you tried with a clean config?

I'll get back to you soon! 🔧

---
*🤖 NullSec Bot*
`;
              labels = ['bug', 'needs-triage'];
              
            // === FEATURE REQUEST / SUGGESTION ===
            } else if (title.includes('feature') || title.includes('request') ||
                      title.includes('suggestion') || title.includes('add support') ||
                      title.includes('would be nice') || title.includes('enhancement')) {
              
              response = `
## 👋 Thanks for the suggestion, @${author}!

I love hearing ideas from users! ✨

### 📋 To Help Evaluate:

1. **Use Case:** What problem does this solve?
2. **Current Workaround:** How do you handle this now?
3. **Priority:** Is this blocking your workflow?
4. **Implementation Ideas:** Any thoughts on how it could work?

### 📊 What Happens Next:

1. I'll review and consider feasibility
2. Might ask follow-up questions
3. If approved, it gets added to the roadmap
4. You're welcome to submit a PR implementing it!

Thanks for helping improve NullSec! 💪

---
*🤖 NullSec Bot*
`;
              labels = ['enhancement', 'needs-triage'];
              
            // === QUESTION / HELP ===
            } else if (title.includes('?') || title.includes('how to') || 
                      title.includes('help') || title.includes('question') ||
                      body.includes('how do i') || body.includes('can i')) {
              
              response = `
## 👋 Hey @${author}! Happy to help!

I'll answer your question soon. In the meantime:

### 📚 Resources:

- 📖 Check the **README** for documentation
- 🔍 Search **existing issues** for similar questions
- 📝 Check the **wiki** if available

### 💡 Tips:

If this is about:
- **Installation** - Include your OS and package manager
- **Usage** - Share the exact commands you're trying
- **Integration** - Describe your setup/environment

I'll get back to you shortly! 

---
*🤖 NullSec Bot*
`;
              labels = ['question'];
              
            // === SECURITY VULNERABILITY ===
            } else if (title.includes('security') || title.includes('vulnerability') ||
                      title.includes('cve') || title.includes('exploit')) {
              
              response = `
## 🔒 Security Report Received

Thanks @${author} for the security report!

⚠️ **Important:** If this is a sensitive vulnerability, please:
1. **Do NOT** post full exploit details publicly
2. Consider using GitHub's private vulnerability reporting
3. Or email security details privately

I'll review this with high priority and respond ASAP.

---
*🤖 NullSec Bot - Security issues are top priority*
`;
              labels = ['security', 'priority'];
              isPriority = true;
              
            // === DEFAULT WELCOME ===
            } else {
              response = `
## 👋 Thanks for opening this issue, @${author}!

I'll review it and respond soon. 

If this is:
- 🐛 **Bug** - Please add reproduction steps
- ✨ **Feature** - Describe your use case
- ❓ **Question** - I'll answer ASAP

---
*🤖 NullSec Bot*
`;
            }
            
            // Post the response
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: response
            });
            
            // Add labels
            if (labels.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: labels
                });
              } catch (e) {
                console.log('Could not add labels:', e.message);
              }
            }
            
            console.log(`Responded to issue #${issue.number} from @${author}`);
            if (isPriority) {
              console.log('⚠️ PRIORITY: Collaboration or security request!');
            }

  auto-label:
    if: github.event_name == 'pull_request_target' && (github.event.action == 'opened' || github.event.action == 'synchronize')
    runs-on: ubuntu-latest
    steps:
      - name: Auto Label PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const labels = [];
            
            // Size labels based on changes
            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;
            const totalChanges = additions + deletions;
            
            if (totalChanges <= 10) labels.push('size/XS');
            else if (totalChanges <= 50) labels.push('size/S');
            else if (totalChanges <= 200) labels.push('size/M');
            else if (totalChanges <= 500) labels.push('size/L');
            else labels.push('size/XL');
            
            // Get files changed
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            const filenames = files.map(f => f.filename.toLowerCase());
            
            // Auto-label by file type
            if (filenames.some(f => f.includes('readme') || f.endsWith('.md'))) labels.push('documentation');
            if (filenames.some(f => f.includes('test') || f.includes('spec'))) labels.push('tests');
            if (filenames.some(f => f.includes('.github/workflows'))) labels.push('ci/cd');
            if (filenames.some(f => f.endsWith('.rs'))) labels.push('rust');
            if (filenames.some(f => f.endsWith('.go'))) labels.push('go');
            if (filenames.some(f => f.endsWith('.py'))) labels.push('python');
            if (filenames.some(f => f.endsWith('.js') || f.endsWith('.ts'))) labels.push('javascript');
            if (filenames.some(f => f.endsWith('.c') || f.endsWith('.cpp') || f.endsWith('.h'))) labels.push('c/c++');
            if (filenames.some(f => f.includes('security') || f.includes('vuln'))) labels.push('security');
            if (filenames.some(f => f.includes('fix') || f.includes('bug'))) labels.push('bugfix');
            
            // Check PR title for conventional commits
            const title = pr.title.toLowerCase();
            if (title.startsWith('feat')) labels.push('feature');
            if (title.startsWith('fix')) labels.push('bugfix');
            if (title.startsWith('docs')) labels.push('documentation');
            if (title.startsWith('chore')) labels.push('chore');
            if (title.startsWith('refactor')) labels.push('refactor');
            
            if (labels.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: labels
                });
                console.log(`Added labels: ${labels.join(', ')}`);
              } catch (e) {
                console.log('Could not add labels (may not exist):', e.message);
              }
            }

  first-time-contributor:
    if: github.event_name == 'pull_request_target' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Check First Time Contributor
        uses: actions/github-script@v7
        with:
          script: |
            const prAuthor = context.payload.pull_request.user.login;
            const repoOwner = context.repo.owner;
            
            if (prAuthor === repoOwner) return;
            
            // Check if this is their first PR to this repo
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            
            const authorPRs = prs.filter(p => p.user.login === prAuthor);
            
            if (authorPRs.length === 1) {
              // First PR! Add special label and extra welcome
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  labels: ['first-contribution']
                });
              } catch (e) {}
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `🎉 **Welcome to the project, @${prAuthor}!** This is your first PR here!\n\nI really appreciate you taking the time to contribute. I'll review this carefully and get back to you soon.\n\n---\n*🤖 NullSec Bot*`
              });
            }

  welcome-new-pr:
    if: github.event_name == 'pull_request_target' && (github.event.action == 'opened' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Welcome PR Author
        uses: actions/github-script@v7
        with:
          script: |
            const prAuthor = context.payload.pull_request.user.login;
            const prNumber = context.payload.pull_request.number;
            const repoOwner = context.repo.owner;
            
            // Don't respond to own PRs
            if (prAuthor === repoOwner) {
              console.log('Skipping - PR from repo owner');
              return;
            }
            
            const welcomeMessage = `
            👋 Hey @${prAuthor}! Thanks for opening this PR!
            
            I'll review this as soon as I can. Here's what happens next:
            
            - 🔍 I'll review your changes
            - 💬 I may leave some comments or suggestions
            - ✅ Once everything looks good, I'll merge it
            
            If this is your first contribution, welcome to the project! 🎉
            
            ---
            *🤖 Automated response from NullSec Bot*
            `;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: welcomeMessage
            });

  respond-to-review:
    if: github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - name: Respond to Review
        uses: actions/github-script@v7
        with:
          script: |
            const review = context.payload.review;
            const prNumber = context.payload.pull_request.number;
            const reviewer = review.user.login;
            const repoOwner = context.repo.owner;
            const prAuthor = context.payload.pull_request.user.login;
            
            // Only respond if repo owner reviewed someone else's PR
            if (reviewer !== repoOwner || prAuthor === repoOwner) {
              return;
            }
            
            let responseMessage = '';
            
            if (review.state === 'approved') {
              responseMessage = `
              ✅ **Approved!** 
              
              Thanks for your contribution @${prAuthor}! I'll merge this shortly.
              
              ---
              *🤖 Automated response from NullSec Bot*
              `;
            } else if (review.state === 'changes_requested') {
              responseMessage = `
              📝 **Changes Requested**
              
              Hey @${prAuthor}, I've left some feedback above. Please take a look and update your PR when you get a chance.
              
              Feel free to ask questions if anything is unclear!
              
              ---
              *🤖 Automated response from NullSec Bot*
              `;
            }
            
            if (responseMessage) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: responseMessage
              });
            }

  handle-commands:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Handle Bot Commands
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment.body.toLowerCase().trim();
            const commenter = context.payload.comment.user.login;
            const prNumber = context.payload.issue.number;
            const repoOwner = context.repo.owner;
            
            // Command responses (anyone can trigger info commands)
            const commands = {
              '/status': `
              📊 **PR Status**
              
              - **State:** ${context.payload.issue.state}
              - **Labels:** ${context.payload.issue.labels.map(l => l.name).join(', ') || 'None'}
              - **Reviewers:** Pending review from maintainer
              
              ---
              *🤖 NullSec Bot*
              `,
              '/help': `
              🤖 **NullSec Bot Commands**
              
              | Command | Description | Access |
              |---------|-------------|--------|
              | \`/status\` | Check PR status | Anyone |
              | \`/help\` | Show this help message | Anyone |
              | \`/ping\` | Check if bot is active | Anyone |
              | \`/lgtm\` | Approve PR | Owner |
              | \`/merge\` | Merge PR | Owner |
              | \`/close\` | Close PR | Owner |
              | \`/hold\` | Put PR on hold | Owner |
              | \`/unhold\` | Remove hold | Owner |
              | \`/wip\` | Mark as work in progress | Owner |
              | \`/ready\` | Mark as ready for review | Owner |
              
              ---
              *🤖 NullSec Bot*
              `,
              '/ping': `
              🏓 **Pong!** Bot is active and responding.
              
              ---
              *🤖 NullSec Bot*
              `
            };
            
            // Check if comment is a command
            for (const [cmd, response] of Object.entries(commands)) {
              if (comment.startsWith(cmd)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: response
                });
                return;
              }
            }
            
            // Owner-only commands
            if (commenter === repoOwner) {
              if (comment.includes('/lgtm') || comment.includes('/approve')) {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  event: 'APPROVE',
                  body: '✅ LGTM! Approved via bot command.'
                });
              }
              
              if (comment.includes('/merge')) {
                try {
                  await github.rest.pulls.merge({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: prNumber,
                    merge_method: 'squash'
                  });
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: '🎉 **Merged!** Thanks for your contribution!\n\n---\n*🤖 NullSec Bot*'
                  });
                } catch (e) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: `❌ **Merge failed:** ${e.message}\n\n---\n*🤖 NullSec Bot*`
                  });
                }
              }
              
              if (comment.includes('/close')) {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  state: 'closed'
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: '🚪 **PR Closed** by maintainer.\n\n---\n*🤖 NullSec Bot*'
                });
              }
              
              if (comment.includes('/hold')) {
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    labels: ['on-hold']
                  });
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: '⏸️ **PR on hold.** Use `/unhold` to resume.\n\n---\n*🤖 NullSec Bot*'
                  });
                } catch (e) {}
              }
              
              if (comment.includes('/unhold')) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    name: 'on-hold'
                  });
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: '▶️ **Hold removed.** PR is back in review queue.\n\n---\n*🤖 NullSec Bot*'
                  });
                } catch (e) {}
              }
              
              if (comment.includes('/wip')) {
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    labels: ['work-in-progress']
                  });
                  await github.rest.pulls.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: prNumber,
                    draft: true
                  });
                } catch (e) {}
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: '🚧 **Marked as Work in Progress.** Use `/ready` when done.\n\n---\n*🤖 NullSec Bot*'
                });
              }
              
              if (comment.includes('/ready')) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    name: 'work-in-progress'
                  });
                  await github.rest.pulls.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: prNumber,
                    draft: false
                  });
                } catch (e) {}
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: '✅ **Ready for review!**\n\n---\n*🤖 NullSec Bot*'
                });
              }
            }

  thank-on-merge:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Thank Contributor on Merge
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const repoOwner = context.repo.owner;
            
            if (author === repoOwner) return;
            
            const messages = [
              `🎉 **Merged!** Thanks @${author} for this contribution!`,
              `✨ **Awesome!** Your changes are now part of the project, @${author}!`,
              `🚀 **Shipped!** Thanks for the great work, @${author}!`,
              `💪 **Merged!** Really appreciate your contribution, @${author}!`
            ];
            
            const message = messages[Math.floor(Math.random() * messages.length)];
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `${message}\n\nYour contribution helps make this project better for everyone. 🙏\n\n---\n*🤖 NullSec Bot*`
            });

  conflict-check:
    if: github.event_name == 'pull_request_target' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    steps:
      - name: Check for Merge Conflicts
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            
            if (pr.mergeable === false) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `⚠️ **Merge Conflicts Detected**\n\nHey @${pr.user.login}, this PR has merge conflicts that need to be resolved.\n\nPlease rebase or merge the latest changes from the base branch.\n\n---\n*🤖 NullSec Bot*`
              });
              
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: ['needs-rebase']
                });
              } catch (e) {}
            }

  stale-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check for Stale PRs
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'updated',
              direction: 'asc'
            });
            
            const now = new Date();
            const staleDays = 14;
            
            for (const pr of prs) {
              const updatedAt = new Date(pr.updated_at);
              const daysSinceUpdate = Math.floor((now - updatedAt) / (1000 * 60 * 60 * 24));
              
              if (daysSinceUpdate >= staleDays) {
                // Check if already marked stale
                const hasStaleLabel = pr.labels.some(l => l.name === 'stale');
                
                if (!hasStaleLabel) {
                  try {
                    await github.rest.issues.addLabels({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: pr.number,
                      labels: ['stale']
                    });
                  } catch (e) {}
                  
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    body: `👋 Hey @${pr.user.login}, this PR has been inactive for ${daysSinceUpdate} days.\n\nIs this still something you're working on? If so, please update or leave a comment.\n\nIf there's no activity in the next 7 days, this PR may be closed.\n\n---\n*🤖 NullSec Bot*`
                  });
                }
              }
            }
