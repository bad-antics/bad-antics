name: PR Monitor & Auto-Responder

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read

jobs:
  monitor-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Monitor External PRs
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const owner = 'bad-antics';
            
            // Polite response templates
            const responses = {
              'thanks': `Thanks for reviewing! Let me know if you need any changes. 🙏`,
              'question': `Great question! I'd be happy to clarify.`,
              'changes': `Thanks for the feedback! I'll update the PR accordingly.`,
              'approval': `Thanks for approving! Really appreciate you taking the time to review. 🎉`,
              'merge': `Thank you so much for merging! Really appreciate the opportunity to contribute. 🚀`,
              'default': `Thanks for the response! Let me know if there's anything else needed.`
            };
            
            // Get all open PRs by bad-antics
            const { data: searchResults } = await github.rest.search.issuesAndPullRequests({
              q: `is:pr is:open author:${owner}`,
              per_page: 100,
              sort: 'updated',
              order: 'desc'
            });
            
            console.log(`Found ${searchResults.total_count} open PRs`);
            
            let needsResponse = [];
            let responded = 0;
            
            for (const pr of searchResults.items) {
              const [repoOwner, repoName] = pr.repository_url.split('/').slice(-2);
              
              try {
                // Get comments on this PR
                const { data: comments } = await github.rest.issues.listComments({
                  owner: repoOwner,
                  repo: repoName,
                  issue_number: pr.number,
                  per_page: 50
                });
                
                // Filter to maintainer comments (not bots, not self)
                const maintainerComments = comments.filter(c => 
                  c.user.login !== owner && 
                  !c.user.login.toLowerCase().includes('bot') &&
                  c.user.type !== 'Bot'
                );
                
                if (maintainerComments.length === 0) continue;
                
                const lastMaintainerComment = maintainerComments[maintainerComments.length - 1];
                const myComments = comments.filter(c => c.user.login === owner);
                const lastMyComment = myComments.length > 0 ? myComments[myComments.length - 1] : null;
                
                // Check if maintainer commented after my last comment
                const maintainerDate = new Date(lastMaintainerComment.created_at);
                const myDate = lastMyComment ? new Date(lastMyComment.created_at) : new Date(0);
                
                if (maintainerDate > myDate) {
                  needsResponse.push({
                    repo: `${repoOwner}/${repoName}`,
                    number: pr.number,
                    title: pr.title,
                    maintainer: lastMaintainerComment.user.login,
                    comment: lastMaintainerComment.body,
                    url: pr.html_url
                  });
                  
                  console.log(`\n🔔 Needs response: ${repoOwner}/${repoName} #${pr.number}`);
                  console.log(`   From: @${lastMaintainerComment.user.login}`);
                  console.log(`   Comment: ${lastMaintainerComment.body.substring(0, 100)}...`);
                }
              } catch (e) {
                console.log(`Error checking ${repoOwner}/${repoName} #${pr.number}: ${e.message}`);
              }
            }
            
            // Summary
            console.log(`\n📊 Summary:`);
            console.log(`   Total PRs: ${searchResults.total_count}`);
            console.log(`   Needs response: ${needsResponse.length}`);
            
            // Create issue with summary if there are PRs needing response
            if (needsResponse.length > 0) {
              const issueBody = `## 🔔 PRs Needing Response
              
            The following PRs have maintainer comments that haven't been responded to:
            
            ${needsResponse.map(pr => `
            ### [${pr.repo} #${pr.number}](${pr.url})
            - **Title:** ${pr.title}
            - **Maintainer:** @${pr.maintainer}
            - **Comment:** ${pr.comment.substring(0, 200)}...
            `).join('\n')}
            
            ---
            *🤖 Auto-generated by PR Monitor*
            `;
              
              // Check if there's already an open issue for this
              const { data: existingIssues } = await github.rest.issues.listForRepo({
                owner: owner,
                repo: owner,
                state: 'open',
                labels: 'pr-monitor',
                per_page: 1
              });
              
              if (existingIssues.length > 0) {
                // Update existing issue
                await github.rest.issues.update({
                  owner: owner,
                  repo: owner,
                  issue_number: existingIssues[0].number,
                  body: issueBody
                });
                console.log(`Updated issue #${existingIssues[0].number}`);
              } else {
                // Create new issue
                try {
                  await github.rest.issues.create({
                    owner: owner,
                    repo: owner,
                    title: `🔔 ${needsResponse.length} PRs need responses`,
                    body: issueBody,
                    labels: ['pr-monitor']
                  });
                  console.log('Created new monitoring issue');
                } catch (e) {
                  console.log('Could not create issue:', e.message);
                }
              }
            }
            
            return { total: searchResults.total_count, needsResponse: needsResponse.length };
